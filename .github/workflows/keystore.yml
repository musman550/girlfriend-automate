name: 1) Generate signing key (sirf ek baar)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -storetype PKCS12 -keystore release.jks \
            -alias usman -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Usman AI SMS, O=Musfira AI, C=PK"
          base64 -w 0 release.jks > KEYSTORE_BASE64.txt
          echo -n "$PASS" > KEYSTORE_PASSWORD.txt
          echo -n "usman" > KEY_ALIAS.txt
          mkdir out && mv KEYSTORE_BASE64.txt KEYSTORE_PASSWORD.txt KEY_ALIAS.txt release.jks out/
      - uses: actions/upload-artifact@v7
        with:
          name: signing-key-SAVE-THEN-DELETE
          path: out/
          retention-days: 1
